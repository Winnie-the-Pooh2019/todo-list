<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
          rel="stylesheet">

<body>
<main class="main-view">
    <div class="new-task">

    <div class="task-section">
        <div class="section-header">

                <div class="task-item__name">
                    To study html fundamentals
                </div>

                    <button class="task-item__actions-button"><img src="./images/check.svg" alt="Check"
                                                                   aria-label="done"></button>
                    <button class="task-item__actions-button"><img src="./images/trash.svg" alt="Trash"
                                                                   aria-label="delete"></button>

            </div>
