<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dist/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect"
          href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
</head>
<body>
<main class="main-view">
    <div class="new-task">
        <input type="text" class="new-task__name" placeholder="Add new task here"/>
        <button class="new-task__add"><img src="./images/plus.svg" alt="Plus"></button>
    </div>
    <div class="task-section">
        <div class="task-section__header">
            <span>Tasks to do</span>
        </div>
        <ul class="tasks-list">
            <li class="task-item">
                <div class="task-item__name">
                    To study html fundamentals
                </div>
                <div class="task-item__actions">
                    <button class="task-item__actions-button task-item__actions-button--check" aria-label="Mark as done">
                        <span class="icon"></span>
                    </button>
                    <button class="task-item__actions-button task-item__actions-button--trash" aria-label="Delete task">
                        <span class="icon"></span>
                    </button>
                </div>
            </li>

            <li class="task-item">
                <div class="task-item__name">
                    To study html fundamentals
                </div>
                <div class="task-item__actions">
                    <button class="task-item__actions-button task-item__actions-button--check" aria-label="Mark as done">
                        <span class="icon"></span>
                    </button>
                    <button class="task-item__actions-button task-item__actions-button--trash" aria-label="Delete task">
                        <span class="icon"></span>
                    </button>
                </div>
            </li>

            <li class="task-item">
                <div class="task-item__name">
                    To study html fundamentals
                </div>
                <div class="task-item__actions">
                    <button class="task-item__actions-button task-item__actions-button--check" aria-label="Mark as done">
                        <span class="icon"></span>
                    </button>
                    <button class="task-item__actions-button task-item__actions-button--trash" aria-label="Delete task">
                        <span class="icon"></span>
                    </button>
                </div>
            </li>

            <li class="task-item">
                <div class="task-item__name">
                    To study html fundamentals
                </div>
                <div class="task-item__actions">
                    <button class="task-item__actions-button task-item__actions-button--check" aria-label="Mark as done">
                        <span class="icon"></span>
                    </button>
                    <button class="task-item__actions-button task-item__actions-button--trash" aria-label="Delete task">
                        <span class="icon"></span>
                    </button>
                </div>
            </li>
        </ul>
    </div>

    <div class="task-section">
        <div class="task-section__header">
            <span>Completed tasks</span>
        </div>
        <ul class="tasks-list">
            <li class="task-item done-task-item">
                <div class="task-item__name">
                    To start project
                </div>
                <div class="task-item__actions">
                    <button class="task-item__actions-button task-item__actions-button--cross" aria-label="Unmark as done">
                        <span class="icon"></span>
                    </button>
                    <button class="task-item__actions-button task-item__actions-button--trash" aria-label="Delete task">
                        <span class="icon"></span>
                    </button>
                </div>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
